[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "menpowidgets"
dynamic = ["version"]
description = "Menpo's Jupyter widgets for fancy visualization"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "AUTHORS.txt"]
authors = [{ name = "The Menpo Development Team", email = "hello@menpo.org" }]
requires-python = ">=3.10"
dependencies = [
    "menpo>=0.12.1",  # 0.12.1 fixes the colour maps and subplot grids with Matplotlib >= 3.9
    "ipywidgets>=8",
    "ipyevents>=2",
    "anywidget>=0.9",
]

[project.optional-dependencies]
menpofit = ["menpofit>=0.8"]  # menpowidgets.menpofitwidgets (AAM, SDM, CLM... visualizations)
# the 3D widgets (visualize_meshes_3d...) draw with Mayavi, which needs a Qt binding
menpo3d = ["menpo3d>=0.9.1", "mayavi>=4.8", "PySide6"]

[project.urls]
Homepage = "https://www.menpo.org"
Source = "https://github.com/menpo/menpowidgets"
Documentation = "https://menpowidgets.readthedocs.io/en/stable/"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3", "ruff"]

[tool.setuptools.packages.find]
include = ["menpowidgets*"]

[tool.setuptools.package-data]
menpowidgets = ["logos/*", "js/*"]

[tool.setuptools_scm]
# The version comes from the vX.Y.Z git tag; the generated file replaces the old vendored miniver.
version_file = "menpowidgets/_version.py"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["menpowidgets"]

[tool.ruff]
line-length = 88
# the notebooks are demos that are run by hand: ruff would also format their JSON
extend-exclude = ["docs", "menpowidgets/_version.py", "notebooks"]

[tool.ruff.lint]
select = ["E9", "F"]
# the package namespaces re-export names from __init__ files, some via star imports
ignore = ["F401", "F403", "F405", "F841"]
